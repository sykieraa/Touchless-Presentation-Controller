<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPC - Touchless Presentation Controller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main id="homePage" class="page active-page">
    <div class="top-bar">
        <button id="exitButton" class="exit-button" type="button">
            <span>←</span> Exit
        </button>
        <span class="version">TPC v1.0</span>
    </div>

    <section class="home-content">
        <div class="brand">
            <h1>TPC</h1>
            <p>Touchless Presentation Controller</p>
        </div>

        <div class="home-actions">
            <button id="chooseFileButton" class="primary-button" type="button">
                <span id="chooseFileText">Choose File</span>
            </button>

            <button id="startPresentationButton" class="primary-button" type="button">
                <span>▶</span> Start Presentation
            </button>

            <button id="tutorialButton" class="primary-button" type="button">
                How to Use TPC
            </button>
        </div>
    </section>

    <footer class="footer">
    <a href="https://github.com/sykieraa"
       target="_blank"
       rel="noopener noreferrer"
       class="github-link"
       aria-label="GitHub">
        <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.25c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.74.08-.74 1.2.09 1.83 1.23 1.83 1.23 1.07 1.83 2.8 1.3 3.48.99.11-.77.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.17 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.3-1.55 3.3-1.23 3.3-1.23.65 1.65.24 2.87.12 3.17.76.84 1.23 1.91 1.23 3.22 0 4.6-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57A12 12 0 0 0 12 .5Z"/>
        </svg>
    </a>

    © TPC 2026<br>
    Developed by @sykieraa
</footer>
</main>

<main id="presentationPage" class="page presentation-page">
    <div class="presentation-top-bar">
        <button id="presentationBackButton" class="back-button" type="button">
            ← Back
        </button>

        <div class="system-status">
            <span class="status-dot"></span>
            System on
        </div>
    </div>

    <section class="presentation-content">
        <h1>Presentation Mode</h1>

        <div class="camera-container">
            <img id="cameraFeed" class="camera-feed" alt="Camera feed">

            <div id="cameraPlaceholder" class="camera-placeholder">
                <span class="camera-dot"></span>
                <strong>Starting camera...</strong>
            </div>
        </div>

        <div class="camera-status">
            <span id="cameraStatus">Starting camera...</span>
        </div>
<!-- fist and open palm -->
        <div class="presentation-controls">
            <button id="previousSlideButton" class="control-button" type="button">
               ✊ Fist → Previous Slide
            </button>

            <button id="nextSlideButton" class="control-button" type="button">
                ✋ Open Palm → Next Slide
            </button>
        </div>
    </section>
</main>

<main id="tutorialPage" class="page tutorial-page">
    <div class="tutorial-top-bar">
        <button id="tutorialBackButton" class="back-button" type="button">
            ← Back
        </button>

        <div class="tutorial-step-title">
            <span>Step</span>
            <strong id="tutorialStepNumber">Step 1</strong>
        </div>
    </div>

    <section class="tutorial-content">
        <div class="tutorial-card">
            <div class="tutorial-image-container">
                <img id="tutorialImage" src="../assets/tutorial/step1.png" alt="TPC tutorial">
            </div>

            <div class="tutorial-description">
                <h2 id="tutorialTitle">Choose File</h2>
                <p id="tutorialText">
                    Select the PowerPoint presentation you want to control.
                </p>
            </div>
        </div>

        <div class="tutorial-controls">
            <button id="tutorialPreviousButton" class="tutorial-control-button" type="button">
                ← Previous
            </button>

            <div id="tutorialIndicator" class="tutorial-indicator">1 / 3</div>

            <button id="tutorialNextBottomButton" class="tutorial-control-button" type="button">
                Next →
            </button>
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
